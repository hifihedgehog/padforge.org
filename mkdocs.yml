site_name: PadForge Documentation
site_url: https://padforge.org/docs/
site_description: >-
  PadForge turns any input device into a virtual controller Windows games
  can use. These docs cover everything from first install to wire protocols.
repo_url: https://github.com/hifihedgehog/PadForge
repo_name: hifihedgehog/PadForge
edit_uri: ""

docs_dir: wiki
site_dir: docs

theme:
  name: material
  custom_dir: wiki/overrides
  logo: assets/logo.png
  favicon: assets/icon.png
  # Fonts load in wiki/overrides/main.html (Archivo, Instrument Sans,
  # JetBrains Mono, matching the landing page); Material's own Google
  # Fonts loader stays off.
  font: false
  palette:
    # Light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    # Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

